# Baut den React-Entwurf und veröffentlicht ihn auf GitHub Pages.
#
# Gebaut wird hier, weil auf dem Rechner der Agentur kein Node liegt —
# und weil so jeder Push dieselbe Fassung erzeugt, unabhängig davon, wer
# ihn auslöst.
#
# WICHTIG: Settings → Pages → Build and deployment → Source muss auf
# "GitHub Actions" stehen.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ohne "version": die Fassung steht schon als packageManager in der
      # package.json, und zwei Angaben lehnt die Action ab.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Abhängigkeiten
        run: pnpm install --frozen-lockfile

      - name: Bauen
        env:
          # Unterordner der Vorschauadresse. Für eine eigene Domain
          # diesen Wert auf "/" setzen.
          BASIS_PFAD: /ckr-alt/
          NODE_ENV: production
        run: pnpm exec vite build

      # Zweiter Bau: dasselbe Programm, aber für Node statt für den
      # Browser. Daraus entsteht kein Auslieferbares, sondern das
      # Werkzeug, mit dem der nächste Schritt HTML erzeugt.
      - name: Bündel zum Vorrendern
        env:
          BASIS_PFAD: /ckr-alt/
          NODE_ENV: production
        run: pnpm exec vite build --config vite.ssr.config.ts

      # Aus jeder Adresse eine echte Datei. Ohne diesen Schritt hätten
      # alle siebzehn Seiten denselben Titel und dasselbe canonical.
      - name: Seiten vorrendern
        env:
          BASIS_PFAD: /ckr-alt/
          BASIS_URL: https://kodozen.github.io/ckr-alt
        run: node tools/vorrendern.mjs

      # ------------------------------------------------------------
      # Indexierung: ein Schalter
      # ------------------------------------------------------------
      # SPERREN: "ja" hängt an jede Seite noindex an.
      #
      # Seit dem 11.10.2026 läuft die Seite unter https://ckrreinigung.at.
      # Diese Vorschau darf ihr bei Google keine Konkurrenz machen — sonst
      # steht derselbe Inhalt unter zwei Adressen, und Google entscheidet
      # selbst, welche zählt.
      #
      # Bewusst NICHT mit "Disallow: /" in robots.txt: Was nicht gecrawlt
      # werden darf, dessen noindex sieht Google nie, und bereits
      # aufgenommene Vorschauadressen blieben im Index hängen. Also:
      # crawlen erlaubt, aber jede Seite sagt "nicht aufnehmen". Die
      # Sitemap-Zeile fällt weg, damit niemand die Vorschau einreicht.
      - name: Indexierung steuern
        env:
          SPERREN: "ja"
        run: |
          if [ "$SPERREN" != "ja" ]; then
            echo "Indexierung erlaubt — robots.txt aus client/public gilt."
            exit 0
          fi
          find dist/public -name '*.html' -exec sed -i \
            's|</head>|<meta name="robots" content="noindex, follow">\n</head>|' {} +
          printf 'User-agent: *\nAllow: /\n' > dist/public/robots.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
