# Baut den React-Entwurf und veröffentlicht ihn auf GitHub Pages.
#
# Gebaut wird hier, weil auf dem Rechner der Agentur kein Node liegt —
# und weil so jeder Push dieselbe Fassung erzeugt, unabhängig davon, wer
# ihn auslöst.
#
# WICHTIG: Settings → Pages → Build and deployment → Source muss auf
# "GitHub Actions" stehen.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ohne "version": die Fassung steht schon als packageManager in der
      # package.json, und zwei Angaben lehnt die Action ab.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Abhängigkeiten
        run: pnpm install --frozen-lockfile

      - name: Bauen
        env:
          # Unterordner der Vorschauadresse. Für eine eigene Domain
          # diesen Wert auf "/" setzen.
          BASIS_PFAD: /ckr-alt/
          NODE_ENV: production
        run: pnpm exec vite build

      # ------------------------------------------------------------
      # Indexierung: ein Schalter
      # ------------------------------------------------------------
      # SPERREN: "ja" hängt noindex an und sperrt robots.txt. Das ist
      # richtig für eine reine Vorführung — aber es ist auch genau das,
      # was eine Messung der Suchmaschinentauglichkeit auf null zieht:
      # "Seite ist für die Indexierung gesperrt" ist dort eine der am
      # stärksten gewichteten Prüfungen.
      #
      # Solange der Kunde die beiden Entwürfe vergleicht, steht der
      # Schalter auf "nein", damit sich die Seite messen lässt. Fällt
      # die Entscheidung gegen diesen Entwurf, gehört er wieder auf
      # "ja" — oder das Depot wird archiviert.
      - name: Indexierung steuern
        env:
          SPERREN: "nein"
        run: |
          if [ "$SPERREN" != "ja" ]; then
            echo "Indexierung erlaubt — robots.txt aus client/public gilt."
            exit 0
          fi
          find dist/public -name '*.html' -exec sed -i \
            's|</head>|<meta name="robots" content="noindex, nofollow">\n</head>|' {} +
          printf 'User-agent: *\nDisallow: /\n' > dist/public/robots.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
